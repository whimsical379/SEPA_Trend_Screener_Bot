name: SEPA A股每日筛选

on:
  # 定时规则：UTC 08:30 = 北京时间 16:30（A股收盘后数据更新完毕）
  schedule:
    - cron: '30 8 * * 1-5'
  # 保留手动触发功能，方便测试
  workflow_dispatch:

jobs:
  run-a-share-strategy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库里的策略代码
      - name: 拉取策略代码
        uses: actions/checkout@v4

      # 2. 配置Python环境
      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. 安装策略所需的所有依赖
      - name: 安装运行依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 运行A股筛选策略
      - name: 执行A股筛选策略
        env:
          # SMTP 邮件推送配置（QQ邮箱授权码等）
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: python sepa_a_share_bot.py

      # 5. 将生成的 CSV 数据自动提交回 GitHub 仓库
      - name: 自动更新A股历史数据库
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          # 检查是否有文件变动
          if [ -f sepa_a_share_signals.csv ]; then
            git add sepa_a_share_signals.csv
            git commit -m "🤖 自动更新A股SEPA历史信号 [$(date +'%Y-%m-%d')]" || echo "无变动需提交"
            git push
          fi

      # 6. 保存运行日志
      - name: 上传运行日志
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: A股策略运行日志
          path: ./*.log
