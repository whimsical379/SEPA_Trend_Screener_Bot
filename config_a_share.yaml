# A股SEPA趋势筛选策略配置文件
# 基于Mark Minervini的SEPA方法论，针对A股市场特点进行参数调整

# ===================== 初筛核心参数 =====================
filters:
  # 市值范围（单位：亿元）
  # A股大盘股相对较少，适当放宽上限
  market_cap_min: 50          # 最小市值50亿元（过滤小盘垃圾股）
  market_cap_max: 10000       # 最大市值10000亿元（1万亿）
  
  # 股价过滤
  price_min: 3                # 最低股价3元（过滤低价股）
  
  # 成交量过滤（单位：元）
  min_turnover: 100000000     # 当日成交额至少1亿元（保证流动性）
  
  # ST股过滤（A股特有）
  exclude_st: true            # 排除ST/*ST股票（风险警示股）
  
  # 行业排除（A股特殊行业）
  exclude_industries:
    - "银行"                  # 周期性太强
    - "证券"                  # 券商股波动大
    - "保险"                  # 金融股特殊
    - "房地产"                # 政策敏感

# ===================== 周期筛选阈值 =====================
thresholds:
  # 周线闸门阈值
  weekly_bias_limit: 1.35     # 周线乖离率上限（A股波动大，适当收紧）
  
  # 日线核心阈值
  daily_bias_limit: 1.45      # 日线乖离率上限（T+1制度，需要更严格）
  daily_rsi_limit: 72         # 日线RSI上限（A股散户多，RSI容易钝化）

# ===================== 择时与交易控制 =====================
timing:
  # 仓位管理
  max_positions: 3            # 最大推荐仓位（A股分散投资）
  
  # 止损止盈（T+1制度，需要更严格的风控）
  stop_loss_pct: 0.05         # 5%止损（T+1无法当日止损，需收紧）
  break_even_pct: 0.10        # 10%保本位（比美股14%更保守）
  
  # 基准指数
  benchmark: "000300"         # 沪深300指数（A股基准）
  
  # 成交量放大倍数
  vol_mult: 1.3               # 成交量需达到20日均量的1.3倍（A股量能更重要）

# ===================== 配置说明 =====================
# 
# A股与美股的关键差异：
# 1. T+1交易制度：无法当日止损，需要更严格的风控参数
# 2. 涨跌停限制：主板10%，创业板/科创板20%
# 3. 散户市场：RSI指标容易钝化，需要调整阈值
# 4. 政策敏感：某些行业（房地产、金融）受政策影响大
# 5. 交易时间：北京时间16:30运行（A股收盘后）
# 
# 参数调整原则：
# - 止损更紧（5% vs 7%）：T+1无法当日止损
# - RSI阈值更宽松（72 vs 70）：A股RSI容易超买钝化
# - 成交量要求更高（1.3x vs 1.0x）：量能是A股重要信号
# - 乖离率更严格（1.35/1.45 vs 1.4/1.5）：防止追高
